<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#02020a">
<title>D.M.R PING PONG</title>
<style>
:root{--a:#ff2233;--b:#2a6bff;--ar:255,34,51;--bb:42,107,255}
*{box-sizing:border-box;margin:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{height:100%;background:#000;overflow:hidden;font-family:system-ui,Roboto,Arial,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;overflow-y:auto;padding:14px;background:rgba(0,0,0,.5)}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
.ov,.ov *{touch-action:pan-y}
input[type=range],#pn{touch-action:auto}
.btn{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:2px solid #fff5;border-radius:16px;padding:13px 22px;font-size:17px;font-weight:800;min-width:240px;max-width:90vw;box-shadow:0 0 16px rgba(var(--bb),.55)}
h1{font-size:clamp(24px,7vw,40px);letter-spacing:4px;text-align:center;text-shadow:0 0 14px var(--a),0 0 26px var(--b)}
@keyframes gl{from{text-shadow:0 0 8px var(--b),0 0 18px var(--b),0 0 26px var(--a)}to{text-shadow:0 0 16px #fff6,0 0 38px var(--b),0 0 56px var(--a)}}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;pointer-events:none}
#sc{font-size:20px;font-weight:800;background:#000a;padding:4px 14px;border-radius:12px;border:1px solid var(--b)}
#hud .bar{display:flex;gap:6px;pointer-events:auto}
#hud button{background:#000b;color:#fff;border:2px solid var(--a);border-radius:10px;font-size:20px;padding:6px 12px}
#pz{position:fixed;top:45%;left:0;right:0;text-align:center;font-size:44px;font-weight:900;pointer-events:none;text-shadow:0 0 20px var(--b)}
#err{position:fixed;left:10px;right:10px;top:40%;background:#900;padding:14px;border-radius:10px;display:none;z-index:99;text-align:center}

/* INICIO */
#start{background:radial-gradient(ellipse at 50% 35%,rgba(var(--bb),.3),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(var(--ar),.25),transparent 55%),rgba(0,0,8,.5)}
.stw{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.ringw{position:relative;width:min(62vw,34vh,280px);aspect-ratio:1}
.ringw::before{content:"";position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(var(--bb),.45),rgba(var(--ar),.15) 55%,transparent 70%);animation:ha 2.4s ease-in-out infinite alternate}
@keyframes ha{from{transform:scale(.9);opacity:.6}to{transform:scale(1.1);opacity:1}}
.ringw img{position:absolute;inset:9%;width:82%;height:82%;border-radius:50%;object-fit:cover;animation:fl 3s ease-in-out infinite alternate}
.fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,11vw,56px);font-weight:900;letter-spacing:3px;animation:gl 2.4s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-8px) scale(1.04)}}
.rg{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--a),transparent 30%,var(--b) 50%,transparent 80%,var(--a));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:sp 3s linear infinite;filter:drop-shadow(0 0 12px var(--b))}
.rg.b{animation-duration:5s;animation-direction:reverse;inset:-5%;opacity:.7}
@keyframes sp{to{transform:rotate(360deg)}}
.stp{letter-spacing:.5em;font-size:clamp(18px,6vw,28px);font-weight:800;margin-left:.5em;text-shadow:0 0 14px var(--b)}
.stg{font-size:11px;letter-spacing:.35em;color:var(--b)}
.pulse{animation:pu 1.4s ease-in-out infinite;font-size:19px;letter-spacing:2px;border-radius:40px;padding:15px 30px}
@keyframes pu{50%{transform:scale(1.07);box-shadow:0 0 34px var(--b)}}

/* LOBBY (limpio) */
#menu{background:radial-gradient(ellipse at 15% 5%,rgba(var(--ar),.35),transparent 55%),radial-gradient(ellipse at 85% 5%,rgba(var(--bb),.4),transparent 55%),linear-gradient(180deg,rgba(0,0,12,.45),rgba(5,5,25,.85))}
#m2{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:16px;padding:6px 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px}
.pf{display:flex;align-items:center;gap:8px;background:#070b22cc;border:2px solid var(--b);border-radius:30px;padding:4px 10px 4px 4px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:#14246a;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.pi{display:flex;flex-direction:column;min-width:0}
.pi small{font-size:10px;opacity:.7}
#pn{width:104px;padding:1px 4px;font-size:16px;font-weight:800;background:transparent;border:0;border-bottom:1px solid var(--b);border-radius:0;color:#fff;user-select:text;-webkit-user-select:text}
#pnOk{background:var(--b);border:0;border-radius:50%;width:28px;height:28px;color:#fff;font-size:14px;font-weight:800;flex:none}
.gear{width:46px;height:46px;border-radius:50%;background:#070b22cc;border:2px solid var(--b);color:#fff;font-size:24px;box-shadow:0 0 14px rgba(var(--bb),.6);flex:none}
#lg{width:min(34vw,17vh,150px);border-radius:50%;box-shadow:0 0 24px rgba(var(--ar),.6),0 0 40px rgba(var(--bb),.5)}
.ttl{text-align:center}
.dmr{font-size:clamp(50px,17vw,80px);font-weight:900;letter-spacing:5px;line-height:1;animation:gl 2.4s ease-in-out infinite alternate}
.pp{letter-spacing:.5em;margin-left:.5em;font-size:clamp(14px,4.6vw,22px);margin-top:4px}
.info{font-size:14px;opacity:.9;letter-spacing:1px}
.big{width:100%;padding:18px 10px;font-size:30px;font-weight:900;letter-spacing:5px;color:#fff;border:2px solid #fff6;border-radius:60px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 26px rgba(var(--bb),.65),inset 0 0 18px #fff3;line-height:1.1}
.big small{display:block;font-size:12px;letter-spacing:2px;font-weight:700;opacity:.9;margin-top:4px}
.big:active,.sec:active{transform:scale(.96)}
.row2{display:flex;gap:10px;width:100%}
.sec{flex:1;padding:15px 6px;font-size:14px;font-weight:800;letter-spacing:1px;color:#fff;border:2px solid var(--b);border-radius:20px;background:#070b22cc;box-shadow:0 0 14px rgba(var(--bb),.5)}

/* AJUSTES */
#set{background:rgba(0,0,10,.8);z-index:20}
.panel{width:100%;max-width:420px;background:rgba(7,11,34,.97);border:2px solid var(--b);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 0 30px rgba(var(--bb),.5)}
.panel h2{text-align:center;letter-spacing:4px;font-size:20px;text-shadow:0 0 12px var(--b)}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;font-weight:700}
.r input[type=range]{flex:1;max-width:52%;accent-color:var(--b)}
.tg{min-width:96px;padding:8px 12px;border-radius:12px;border:2px solid var(--b);background:#0a1030;color:#fff;font-weight:800;font-size:13px}
.vs{display:flex;align-items:center;gap:6px}
.vs b{min-width:70px;text-align:center;font-size:13px}
.sm{width:34px;height:34px;border-radius:10px;border:2px solid var(--b);background:#0a1030;color:#fff;font-size:16px;font-weight:800}
.vsub{font-size:11px;opacity:.6;text-align:right;margin-top:-8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* NIVELES */
#lvs{background:radial-gradient(ellipse at 15% 5%,rgba(var(--ar),.35),transparent 55%),radial-gradient(ellipse at 85% 5%,rgba(var(--bb),.4),transparent 55%),linear-gradient(180deg,rgba(0,0,12,.6),rgba(5,5,25,.92))}
#lvs .box{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 16px}
.leg{font-size:12px;opacity:.85;text-align:center;line-height:1.6}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.lb{padding:14px 0;font-size:17px;background:#0a1030;color:#fff;border:2px solid var(--b);border-radius:12px}
.lb.sel{background:linear-gradient(90deg,var(--a),var(--b));border-color:#fff;font-weight:800;box-shadow:0 0 14px var(--b)}
.lb.lk{opacity:.28}
</style></head><body>
<canvas id="c"></canvas>

<!-- INICIO -->
<div id="start" class="ov"><div class="stw">
 <div class="ringw"><img id="slg" src="./logo.png" alt=""><span id="sfb" class="fb hide">D.M.R</span><div class="rg"></div><div class="rg b"></div></div>
 <div class="stp">PING PONG</div>
 <button id="bStart" class="btn pulse">▶ TOCA PARA INICIAR</button>
 <div class="stg">MÁS QUE UN JUEGO</div>
</div></div>

<!-- LOBBY -->
<div id="menu" class="ov hide"><div id="m2">
 <div class="top">
  <div class="pf"><div class="av">👤</div><div class="pi"><input id="pn" maxlength="12" placeholder="Tu nombre"><small id="pl">Jugador</small></div><button id="pnOk">✔</button></div>
  <button id="gear" class="gear" aria-label="Ajustes">⚙</button>
 </div>
 <img id="lg" src="./logo.png" alt="">
 <div class="ttl"><div class="dmr">D.M.R</div><div class="pp">PING PONG</div></div>
 <div class="info">🏆 <b id="tb1">0</b>/100 &nbsp;·&nbsp; ⭐ <b id="tb2">0</b></div>
 <button id="nPlay" class="big">▶ JUGAR<small id="ndf">NIVEL 1</small></button>
 <div class="row2"><button id="n2p" class="sec">👥 2 JUGADORES</button><button id="nLv" class="sec">🎯 NIVELES</button></div>
</div></div>

<!-- AJUSTES -->
<div id="set" class="ov hide"><div class="panel">
 <h2>⚙ AJUSTES</h2>
 <div class="r"><span>🔊 Sonido</span><button id="sSnd" class="tg">ON</button></div>
 <div class="r"><span>🎵 Música</span><input id="sMus" type="range" min="0" max="100"></div>
 <div class="r"><span>💥 Efectos</span><input id="sSfx" type="range" min="0" max="100"></div>
 <div class="r"><span>🎙 Voz</span><div class="vs"><button id="vPrev" class="sm">‹</button><b id="vName">AUTO</b><button id="vNext" class="sm">›</button><button id="vTest" class="sm">▶</button></div></div>
 <div class="vsub" id="vSub"></div>
 <div class="r"><span>☀ Brillo</span><input id="sBr" type="range" min="50" max="130"></div>
 <div class="r"><span>🎨 Color</span><button id="sTh" class="tg">ROJO · AZUL</button></div>
 <div class="r"><span>📳 Vibración</span><button id="sVib" class="tg">ON</button></div>
 <button class="btn" id="sClose">LISTO</button>
</div></div>

<!-- NIVELES -->
<div id="lvs" class="ov hide"><div class="box">
 <h1>NIVELES</h1>
 <div class="leg">1 = FÁCIL · 2-10 = MEDIO · 11-20 = DIFÍCIL · 21+ = EXPERTO<br>Supera un nivel para desbloquear el siguiente</div>
 <div id="grid"></div>
 <button class="btn" id="lvBack">↩ VOLVER</button>
</div></div>

<div id="hud" class="hide"><div id="sc">0 - 0</div><div class="bar"><button id="bp">⏸</button><button id="br">↻</button><button id="bm">☰</button></div></div>
<div id="pz" class="hide">PAUSA</div>
<div id="end" class="ov hide"><h1 id="et"></h1><button class="btn hide" id="bnext">SIGUIENTE NIVEL ➜</button><button class="btn" id="ba">VOLVER A JUGAR</button><button class="btn" id="bmenu">MENÚ</button></div>
<div id="err"></div>

<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d');
const lerp=(a,b,t)=>a+(b-a)*t,cl=v=>Math.max(0,Math.min(1,v)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let CW,CH,D,S=1,OX=0,OY=0,por=false;
function rs(){D=Math.min(devicePixelRatio||1,2);CW=innerWidth;CH=innerHeight;cv.width=CW*D;cv.height=CH*D;por=CH>CW;const lw=por?CH:CW,lh=por?CW:CH;S=Math.min(lw/800,lh/500);OX=(lw-800*S)/2;OY=(lh-500*S)/2}
addEventListener('resize',rs);rs();
function showErr(m){const e=$('err');e.style.display='block';e.textContent='Error: '+m}
window.onerror=m=>showErr(m);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ============ AJUSTES (se guardan en el teléfono) ============ */
let SET={snd:true,mus:55,sfx:80,br:100,th:0,vib:true,voice:-1};
try{Object.assign(SET,JSON.parse(localStorage.getItem('dmr_set')||'{}'))}catch(e){}
function saveS(){try{localStorage.setItem('dmr_set',JSON.stringify(SET))}catch(e){}}
const TH=[{n:'ROJO · AZUL',a:'#ff2233',b:'#2a6bff'},{n:'VERDE · CIAN',a:'#19e68c',b:'#00c8ff'},{n:'MORADO · ROSA',a:'#ff3df2',b:'#8a5bff'},{n:'DORADO · FUEGO',a:'#ffc400',b:'#ff5a1f'}];
let T=TH[0];
const rgb=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255].join(',')};
function applyTheme(){T=TH[SET.th]||TH[0];const r=document.documentElement.style;r.setProperty('--a',T.a);r.setProperty('--b',T.b);r.setProperty('--ar',rgb(T.a));r.setProperty('--bb',rgb(T.b))}
function applyBr(){document.body.style.filter='brightness('+SET.br/100+')'}
function vib(ms){if(SET.vib&&navigator.vibrate){try{navigator.vibrate(ms)}catch(e){}}}
applyTheme();applyBr();

/* ============ LOGO ============ */
const logo=new Image();let logoOK=false;
logo.onload=()=>logoOK=true;logo.src='./logo.png';
function chk(img,fn){if(img.complete){if(!img.naturalWidth)fn()}else img.addEventListener('error',fn)}
chk($('lg'),()=>$('lg').classList.add('hide'));
chk($('slg'),()=>{$('slg').classList.add('hide');$('sfb').classList.remove('hide')});

/* ============ PERFIL Y NIVELES ============ */
let prof={name:'PLAYER',w:0,l:0,best:0,nameSet:false};
try{Object.assign(prof,JSON.parse(localStorage.getItem('dmr_prof')||'{}'))}catch(e){}
function saveP(){try{localStorage.setItem('dmr_prof',JSON.stringify(prof))}catch(e){}}
const dn=()=>prof.name||'PLAYER';
let selLv=Math.min(100,prof.best+1),lvl=1;
function diffName(L){return L===1?'FÁCIL':L<=10?'MEDIO':L<=20?'DIFÍCIL':L<=50?'EXPERTO':'LEYENDA'}
function paintGrid(){const k=$('grid').children;for(let i=0;i<k.length;i++){const n=i+1;k[i].className='lb'+(n>prof.best+1?' lk':'')+(n===selLv?' sel':'')}
 $('ndf').textContent='NIVEL '+selLv+' · '+diffName(selLv);$('tb1').textContent=prof.best;$('tb2').textContent=prof.w}
function buildGrid(){const g=$('grid');g.innerHTML='';for(let i=1;i<=100;i++){const b=document.createElement('button');b.textContent=i;
 b.onclick=()=>{if(i>prof.best+1)return;selLv=i;SFX.click();paintGrid();closeLevels()};g.appendChild(b)}paintGrid()}
function openLevels(){$('menu').classList.add('hide');$('lvs').classList.remove('hide');$('lvs').scrollTo(0,0)}
function closeLevels(){$('lvs').classList.add('hide');$('menu').classList.remove('hide')}
/* El nombre se puede cambiar UNA sola vez */
function lockName(){const l=!!prof.nameSet;$('pn').readOnly=l;$('pnOk').classList.toggle('hide',l);$('pl').textContent=l?'Jugador 🔒':'1 solo cambio'}
function showP(){$('pn').value=prof.name;lockName();paintGrid()}
$('pnOk').onclick=()=>{const n=$('pn').value.trim().slice(0,12);if(!n)return;
 if(confirm('¿Guardar el nombre "'+n+'"?\nSolo podrás cambiarlo UNA vez.')){prof.name=n;prof.nameSet=true;saveP();showP()}};
buildGrid();showP();

/* ============ AUDIO ============
   Voz = lo más fuerte. La música es suave y baja sola cuando alguien habla (ducking). */
let AC,mBus,sBus,duckG,NB=null;
function au(){
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();
  duckG=AC.createGain();duckG.connect(AC.destination);
  mBus=AC.createGain();mBus.connect(duckG);
  sBus=AC.createGain();sBus.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setVols()}catch(e){}}
 if(AC&&AC.state==='suspended')AC.resume()}
function setVols(){if(!AC)return;const t=AC.currentTime;
 mBus.gain.setTargetAtTime(SET.snd?SET.mus/100*.8:0,t,.05);
 sBus.gain.setTargetAtTime(SET.snd?SET.sfx/100*.7:0,t,.05)}
function duck(sec){if(!AC)return;const t=AC.currentTime;duckG.gain.cancelScheduledValues(t);duckG.gain.setTargetAtTime(.2,t,.04);duckG.gain.setTargetAtTime(1,t+sec,.4)}
function tone(f,d,ty,v,f2){if(!AC||!SET.snd)return;const t=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();
 o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 a.gain.setValueAtTime(.3*(v||1)+.0001,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(sBus);o.start(t);o.stop(t+d)}
const SFX={
 click:()=>tone(800,.07,'square',.5,1200),
 ping:()=>tone(1500,.12,'triangle',1,900),pong:()=>tone(700,.14,'triangle',1,400),bounce:()=>tone(300,.07,'sine',.8,150),
 whoosh:()=>tone(100,1.2,'sawtooth',.25,1200),
 thump:()=>{tone(90,.4,'sine',.7,45)},                       // golpe suave en cada letra (no tapa la voz)
 impact:()=>{tone(70,.9,'sawtooth',.6,25);tone(1400,.6,'sine',.3,150)},
 turbo:()=>tone(300,.35,'square',.5,1600),
 point:()=>{tone(523,.15,'square',.4);setTimeout(()=>tone(784,.2,'square',.4),130)},
 start:()=>{tone(400,.12,'square',.4);setTimeout(()=>tone(600,.12,'square',.4),120);setTimeout(()=>tone(900,.2,'square',.4),240)},
 win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',.4),i*150)),
 lose:()=>[400,330,260,200].forEach((f,i)=>setTimeout(()=>tone(f,.3,'sawtooth',.4),i*180))};

/* ---- MÚSICA DE FONDO (generada, sin archivos) ---- */
let mOn=false,mStep=0,mNext=0,mMode='menu';
const BASS=[55,43.65,65.41,49],ARP=[0,3,7,12,7,3,10,7];
function mt(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(mBus);o.start(t);o.stop(t+d+.05)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
 g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(mBus);o.start(t);o.stop(t+.2)}
function hat(t){const s=AC.createBufferSource(),h=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;h.type='highpass';h.frequency.value=7000;
 g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(h);h.connect(g);g.connect(mBus);s.start(t);s.stop(t+.06)}
function mstep(s,t){const b=BASS[(s>>3)&3],n=s&7,g=mMode==='game',it=mMode==='intro';
 if(n%4===0)mt(b*2,t,.55,'triangle',g?.5:.4);
 if(g&&n===6)mt(b*2,t,.25,'triangle',.4);
 mt(b*4*Math.pow(2,ARP[n]/12),t,g?.18:.28,g?'square':'triangle',g?.06:.09);
 if(g){if(n%4===0)kick(t);else if(n%2===1)hat(t)}
 if(it&&n===0)mt(b*4,t,2,'sawtooth',.05)}
const mDur=()=>mMode==='game'?.24:mMode==='intro'?.27:.32;
function musicTick(){if(!AC||AC.state!=='running')return;if(mNext<AC.currentTime-.5)mNext=AC.currentTime+.05;
 while(mNext<AC.currentTime+.25){mstep(mStep++,mNext);mNext+=mDur()}}
function musicStart(){if(!AC||mOn)return;mOn=true;mNext=AC.currentTime+.1;setInterval(musicTick,80)}
function setMusic(m){mMode=m}
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden){AC.suspend();try{speechSynthesis.cancel()}catch(e){}}else AC.resume()});

/* ---- VOZ DE HOMBRE EN INGLÉS (usa las voces de tu teléfono) ----
   Busca voces masculinas y las pone primero. En Ajustes puedes cambiar de voz. */
let VL=[];
const MALE=/en[-_]us[-_]x[-_](iol|iom|tpd)|en[-_]gb[-_]x[-_](rjs|gbb|gbd)|\bmale\b|david|daniel|guy|mark|james|alex|fred|george|ryan|thomas|rjs/i;
function loadVoices(){if(!window.speechSynthesis)return;

$('bmenu').onclick=$('bm').onclick=()=>{SFX.click();mode='menu';setMusic('menu');paused=false;$('pz').classList.add('hide');$('end').classList.add('hide');$('hud').classList.add('hide');$('lvs').classList.add('hide');$('menu').classList.remove('hide');selLv=Math.min(100,prof.best+1);showP()};
$('bp').onclick=()=>{if(mode==='play'){paused=!paused;$('pz').classList.toggle('hide',!paused)}};
$('br').onclick=()=>{if(mode==='play'||mode==='over')newGame(two)};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;if(e.code==='KeyP')$('bp').onclick()});
addEventListener('keyup',e=>keys[e.code]=false);

/* Táctil: arrastra el dedo. En 2 jugadores cada dedo controla su lado. */
const PM={};
const lgc=e=>{const lx=por?CH-e.clientY:e.clientX,ly=por?e.clientX:e.clientY;return[(lx-OX)/S,(ly-OY)/S]};
cv.addEventListener('pointerdown',e=>{
 if(mode==='intro'){if(I&&I.t>10.2){au();SFX.click();endIntro()}return}   // entra SOLO cuando el usuario toca
 if(mode!=='play'||paused)return;
 const[lx,ly]=lgc(e),i=two&&lx>W/2?1:0;PM[e.pointerId]=i;P[i].ty=clamp(ly,P[i].h/2,H-P[i].h/2)});
cv.addEventListener('pointermove',e=>{const i=PM[e.pointerId];if(i==null||mode!=='play'||paused)return;
 const ly=lgc(e)[1];P[i].ty=clamp(ly,P[i].h/2,H-P[i].h/2)});
['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,e=>{delete PM[e.pointerId]}));
</script>
