<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050510">
<title>D·M·R | DIVINE PONG</title>
<style>
:root{--c:#00F5FF;--p:#7000FF;--bg:#050510}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;
  font-family:'Trebuchet MS','Segoe UI',Roboto,sans-serif;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD / marcador */
#hud{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;display:none;align-items:center;
  justify-content:center;gap:14px;padding:8px;pointer-events:none;font-weight:900;letter-spacing:2px}
.playing #hud{display:flex}
#hud span{font-size:clamp(34px,8vw,56px);min-width:1.2em;text-align:center;color:var(--c);
  text-shadow:0 0 10px var(--c),0 0 28px var(--c)}
#hud span:last-of-type{color:#b98cff;text-shadow:0 0 10px var(--p),0 0 28px var(--p)}
#hud b{font-size:13px;opacity:.85;text-shadow:0 0 8px #fff}
#hud i{font-size:34px;opacity:.6;font-style:normal}
#quit{pointer-events:auto;position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));
  width:38px;height:38px;border-radius:50%;border:2px solid var(--c);background:rgba(0,245,255,.1);
  color:#fff;font-size:16px;box-shadow:0 0 12px var(--c)}

/* Mensajes de poderes */
#msg{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:clamp(22px,6vw,40px);
  font-weight:900;letter-spacing:3px;opacity:0;pointer-events:none}
#msg.show{animation:pop 1.4s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}

/* Pantallas */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:rgba(5,5,16,.55);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex;animation:fade .35s}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{font-size:clamp(46px,14vw,96px);letter-spacing:6px;text-align:center;line-height:1;
  background:linear-gradient(90deg,var(--c),var(--p));-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 0 14px var(--c));animation:pulse 3s ease-in-out infinite;margin-bottom:12px}
h1 small{display:block;font-size:.28em;letter-spacing:.45em;margin-top:8px;-webkit-text-fill-color:#fff;color:#fff}
@keyframes pulse{50%{filter:drop-shadow(0 0 28px var(--p));transform:scale(1.03)}}
h2{font-size:clamp(24px,7vw,38px);letter-spacing:4px;color:var(--c);text-shadow:0 0 14px var(--c);text-align:center}
p{font-size:20px;letter-spacing:3px;text-shadow:0 0 10px var(--p)}

/* Botones neón */
.btn{min-width:min(78vw,300px);padding:14px 30px;border-radius:50px;font-size:18px;font-weight:800;letter-spacing:3px;
  color:#fff;border:2px solid var(--c);background:linear-gradient(135deg,rgba(0,245,255,.2),rgba(112,0,255,.35));
  box-shadow:0 0 14px var(--c),inset 0 0 14px rgba(0,245,255,.25);text-shadow:0 0 8px var(--c);transition:transform .1s}
.btn:active{transform:scale(.94)}
.btn.alt{border-color:var(--p);box-shadow:0 0 14px var(--p),inset 0 0 12px rgba(112,0,255,.3);text-shadow:0 0 8px var(--p);font-size:15px;padding:11px 26px}
.btn.god{border-color:#ff2bd6;box-shadow:0 0 18px #ff2bd6,inset 0 0 14px rgba(255,43,214,.3);text-shadow:0 0 8px #ff2bd6}

/* Selector de color */
#sw{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:300px;margin:8px 0}
.sw{width:54px;height:54px;border-radius:50%;border:3px solid transparent}
.sw.sel{border-color:#fff;transform:scale(1.15)}

/* Horizontal / pantallas bajas */
@media (max-height:520px){
  .screen{gap:8px}h1{font-size:44px;margin-bottom:4px}
  .btn{padding:9px 26px;font-size:15px}.btn.alt{padding:8px 22px;font-size:13px}.sw{width:42px;height:42px}
}
</style>
</head>
<body>
<script>if(!sessionStorage.getItem('dmr_intro')){sessionStorage.setItem('dmr_intro','1');location.replace('./index.html')}</script>
<canvas id="cv"></canvas>
<div id="msg"></div>
<div id="hud"><b id="n1">J1</b><span id="s1">0</span><i>:</i><span id="s2">0</span><b id="n2">J2</b>
  <button id="quit" data-go="home">✕</button></div>

<section class="screen on" id="home">
  <h1>D·M·R<small>DIVINE PONG</small></h1>
  <button class="btn" data-go="modes">▶ JUGAR</button>
  <button class="btn alt" data-go="custom">🎨 PERSONALIZAR</button>
  <button class="btn alt" id="snd">🔊 SONIDO: ON</button>
</section>

<section class="screen" id="modes"><h2>ELIGE MODO</h2>
  <button class="btn" data-go="diff">🤖 1 VS IA</button>
  <button class="btn" data-mode="local">👥 1 VS 1 LOCAL</button>
  <button class="btn" data-mode="online">🌐 ONLINE</button>
  <button class="btn alt" data-go="home">← VOLVER</button>
</section>

<section class="screen" id="diff"><h2>DIFICULTAD</h2>
  <button class="btn" data-diff="0">😇 FÁCIL</button>
  <button class="btn" data-diff="1">⚡ NORMAL</button>
  <button class="btn god" data-diff="2">👁 GOD MODE</button>
  <button class="btn alt" data-go="modes">← VOLVER</button>
</section>

<section class="screen" id="custom"><h2>COLOR DE TU PALETA</h2>
  <div id="sw"></div>
  <button class="btn alt" data-go="home">← LISTO</button>
</section>

<section class="screen" id="online"><h2>ONLINE</h2>
  <p id="onl">Buscando rival…</p>
  <button class="btn alt" data-go="modes">CANCELAR</button>
</section>

<section class="screen" id="over"><h2 id="win"></h2><p id="fin"></p>
  <button class="btn" id="again">⟳ REVANCHA</button>
  <button class="btn alt" data-go="home">☰ MENÚ</button>
</section>

<script>
'use strict';
/* ===== D·M·R | DIVINE PONG — Vanilla JS, sin librerías ===== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const H=500,WIN=7,BASE_H=90,PW=14,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=900,S=1,D=1,CW=0,CH=0,portrait=false;
let state='menu',mode='ai',lvl=1,P=[],B=null,score=[0,0],bounces=0,lastHit=0,pw=null,parts=[],
    shake=0,serveT=0,aiErr=0,onT=0;
let cfg={col:'#00F5FF'};try{cfg.col=localStorage.getItem('dmr_col')||cfg.col}catch(e){}
const LV=[{sp:300,err:110},{sp:520,err:40},{sp:2000,err:0}];   // Fácil / Normal / GOD
const PWT=[{n:'⬆ PALETA GIGANTE',c:'#00F5FF',i:'⬆️'},{n:'⬇ RIVAL ENCOGIDO',c:'#ff2bd6',i:'⬇️'},
  {n:'🔥 PELOTA DE FUEGO',c:'#ff6a00',i:'🔥'},{n:'👻 PELOTA FANTASMA',c:'#b388ff',i:'👻'},{n:'❄ RIVAL CONGELADO',c:'#9fe8ff',i:'❄️'}];

/* ---------- AUDIO 8-bit (Web Audio, sin archivos) ---------- */
const A={c:null,on:true,
  init(){if(!this.c){const C=window.AudioContext||window.webkitAudioContext;if(C)this.c=new C()}
    if(this.c&&this.c.state==='suspended')this.c.resume()},
  tone(f,d=.1,type='square',v=.1,to=0,delay=0){
    if(!this.on||!this.c)return;const t=this.c.currentTime+delay,o=this.c.createOscillator(),g=this.c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(this.c.destination);o.start(t);o.stop(t+d)},
  seq(n,d=.09,type='square',v=.1){n.forEach((f,i)=>this.tone(f,d,type,v,0,i*d))},
  sfx(k){const T=this;({
    click:()=>T.tone(700,.06,'square',.08,1000),hit:()=>T.tone(420,.08,'square',.12,260),
    wall:()=>T.tone(200,.06,'triangle',.14),score:()=>T.seq([523,659,784,1047]),
    lose:()=>T.seq([330,262,196,131],.12,'sawtooth'),power:()=>T.seq([500,750,1000,1500],.06),
    freeze:()=>T.tone(1800,.5,'sine',.12,150),fire:()=>T.tone(100,.4,'sawtooth',.12,600),
    ghost:()=>T.tone(900,.5,'sine',.1,300),win:()=>T.seq([523,659,784,1047,784,1047,1319],.12),
    go:()=>T.seq([440,440,880],.1)}[k]||(()=>{}))()}
};
// Música de fondo: bajo + arpegio en bucle
let st=0;setInterval(()=>{if(!A.on||!A.c||A.c.state!=='running')return;
  const b=[55,55,65.4,49][(st>>3)&3]*2,m=[0,3,7,12,7,3,7,10][st&7];
  if(st%4===0)A.tone(b,.35,'sawtooth',.05);A.tone(b*4*2**(m/12),.14,'triangle',.04);st++},170);

/* ---------- RED (listo para Firebase RTDB o PeerJS) ---------- */
const Net={room:null,
  send(d){/* FIREBASE: set(ref(db,`rooms/${this.room}/p${me}`),d)  |  PEERJS: this.conn.send(d) */},
  onData(cb){/* FIREBASE: onValue(ref(db,`rooms/${this.room}/p${rival}`),s=>cb(s.val()))  |  PEERJS: conn.on('data',cb) */}};

/* ---------- Pantalla / escala (en vertical el campo gira 90°) ---------- */
function resize(){D=Math.min(devicePixelRatio||1,2);CW=innerWidth;CH=innerHeight;cv.width=CW*D;cv.height=CH*D;
  portrait=CH>CW;S=(portrait?CW:CH)/H;W=(portrait?CH:CW)/S;if(P.length){P[0].x=30;P[1].x=W-30}}
addEventListener('resize',resize);resize();

/* ---------- Estrellas ---------- */
const stars=[...Array(100)].map(()=>({x:Math.random()*1400,y:Math.random()*H,r:Math.random()*1.6+.3,v:Math.random()*8+2,t:Math.random()*6}));

/* ---------- Entrada táctil: arrastrar el dedo ---------- */
const lg=e=>portrait?{x:(CH-e.clientY)/S,y:e.clientX/S}:{x:e.clientX/S,y:e.clientY/S};
const ptr={};
cv.addEventListener('pointerdown',e=>{A.init();if(state!=='play')return;const q=lg(e);
  ptr[e.pointerId]=mode==='local'?(q.x<W/2?0:1):0;P[ptr[e.pointerId]].ty=q.y});
cv.addEventListener('pointermove',e=>{const s=ptr[e.pointerId];if(s!=null)P[s].ty=lg(e).y});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>delete ptr[e.pointerId]));
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- Juego ---------- */
function say(m,c){const e=$('msg');e.textContent=m;e.style.color=c;e.style.textShadow=`0 0 18px ${c}`;
  e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
function upd(){$('s1').textContent=score[0];$('s2').textContent=score[1]}
function emit(x,y,n,c,sp=220){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6+Math.random()*.4,c})}}
function serve(dir){B={x:W/2,y:H/2,vx:0,vy:0,r:9,sp:520,dir,fire:0,ghost:0,tr:[]};serveT=1.2}
function start(){
  score=[0,0];bounces=0;pw=null;parts=[];for(const k in ptr)delete ptr[k];
  const c2=cfg.col.toLowerCase()==='#7000ff'?'#00F5FF':'#7000FF';
  P=[0,1].map(i=>({x:i?W-30:30,y:H/2,ty:H/2,col:i?c2:cfg.col,grow:0,shrink:0,frozen:0,h:BASE_H}));
  $('n1').textContent=mode==='ai'?'TÚ':'J1';$('n2').textContent=mode==='local'?'J2':mode==='online'?'RIVAL':'IA';
  show(null);document.body.classList.add('playing');state='play';serve(Math.random()<.5?1:-1);upd();A.sfx('go')}
function end(w){state='over';document.body.classList.remove('playing');
  $('win').textContent=mode==='local'?`¡GANA J${w+1}!`:w===0?'¡VICTORIA DIVINA!':'DERROTA';
  $('fin').textContent=score[0]+' : '+score[1];A.sfx(w===0||mode==='local'?'win':'lose');setTimeout(()=>show('over'),700)}
function point(w){score[w]++;shake=18;upd();emit(w?0:W,B.y,40,P[w].col,420);
  if(mode==='local'||w===1){navigator.vibrate&&navigator.vibrate(250)}          // vibra al perder punto
  A.sfx(w===0||mode==='local'?'score':'lose');
  if(score[w]>=WIN)end(w);else serve(w===0?1:-1)}
function hit(i){const p=P[i],s=i?-1:1,rel=clamp((B.y-p.y)/(p.h/2),-1,1),a=rel*.9;   // ángulo según dónde golpea
  B.sp=Math.min(B.sp*1.04+6,950);B.vx=Math.cos(a)*B.sp*s;B.vy=Math.sin(a)*B.sp;B.x=p.x+s*(PW/2+B.r+1);
  bounces++;lastHit=i;shake=Math.max(shake,4);emit(B.x,B.y,12,p.col);A.sfx('hit');
  if(i===0)aiErr=(Math.random()-.5)*2*LV[mode==='online'?1:lvl].err;
  if(bounces%10===0){pw={t:Math.floor(Math.random()*5),a:0};A.sfx('power');say('✨ ¡PODER! ✨','#fff')}}   // cada 10 rebotes
function applyPW(t,o){const e=1-o;say(PWT[t].n,PWT[t].c);A.sfx('power');
  if(t===0)P[o].grow=8;if(t===1)P[e].shrink=8;
  if(t===2){B.fire=4;A.sfx('fire')}if(t===3){B.ghost=1.5;A.sfx('ghost')}if(t===4){P[e].frozen=2;A.sfx('freeze')}}

// IA: predice la trayectoria (con rebotes en paredes) en vez de seguir la pelota
function ai(dt){const p=P[1];if(p.frozen>0)return;const L=LV[mode==='online'?1:lvl];let t=H/2;
  if(B.vx>0){let y=B.y+B.vy*(p.x-B.x)/B.vx;const r=B.r,per=2*(H-2*r),m=(((y-r)%per)+per)%per;
    y=r+(m<=H-2*r?m:per-m);t=y+aiErr}
  p.y+=clamp(t-p.y,-L.sp*dt,L.sp*dt)}

function update(dt){
  stars.forEach(s=>{s.x-=s.v*dt;if(s.x<0)s.x=W;s.t+=dt});
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt});parts=parts.filter(p=>p.l>0);shake*=.9;
  if(state!=='play')return;
  P.forEach((p,i)=>{p.grow=Math.max(0,p.grow-dt);p.shrink=Math.max(0,p.shrink-dt);p.frozen=Math.max(0,p.frozen-dt);
    const th=BASE_H*(p.grow>0?1.6:1)*(p.shrink>0?.6:1);p.h+=(th-p.h)*Math.min(1,dt*10);
    if(!p.frozen&&!(i===1&&mode!=='local'))p.y+=(p.ty-p.y)*Math.min(1,dt*20);
    p.y=clamp(p.y,p.h/2,H-p.h/2)});
  if(mode!=='local')ai(dt);
  if(mode==='online')Net.send({y:P[0].y});
  if(serveT>0){serveT-=dt;if(serveT<=0){const a=(Math.random()-.5)*.8;B.vx=Math.cos(a)*B.sp*B.dir;B.vy=Math.sin(a)*B.sp}return}
  B.fire=Math.max(0,B.fire-dt);B.ghost=Math.max(0,B.ghost-dt);
  B.tr.push({x:B.x,y:B.y});if(B.tr.length>16)B.tr.shift();
  for(let k=0;k<2;k++){const h=dt/2,m=B.fire>0?2:1;B.x+=B.vx*h*m;B.y+=B.vy*h*m;   // 2 sub-pasos: no atraviesa paletas
    if(B.y<B.r){B.y=B.r;B.vy=Math.abs(B.vy);A.sfx('wall');emit(B.x,B.y,5,'#fff',120)}
    else if(B.y>H-B.r){B.y=H-B.r;B.vy=-Math.abs(B.vy);A.sfx('wall');emit(B.x,B.y,5,'#fff',120)}
    for(let i=0;i<2;i++){const p=P[i],s=i?-1:1,dx=(B.x-p.x)*s;
      if(B.vx*s<0&&dx<PW/2+B.r&&dx>-PW&&Math.abs(B.y-p.y)<p.h/2+B.r)hit(i)}}
  if(pw){pw.a+=dt;if(Math.hypot(B.x-W/2,B.y-H/2)<B.r+26){applyPW(pw.t,lastHit);pw=null}}
  if(B.x<-30)point(1);else if(B.x>W+30)point(0)}

/* ---------- Dibujo ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){
  ctx.setTransform(D,0,0,D,0,0);ctx.fillStyle='#050510';ctx.fillRect(0,0,CW,CH);
  if(portrait){ctx.translate(0,CH);ctx.rotate(-Math.PI/2)}ctx.scale(S,S);
  // nebulosas
  [[W*.2,H*.3,'112,0,255',.18],[W*.8,H*.7,'0,245,255',.12]].forEach(([x,y,c,a])=>{
    const g=ctx.createRadialGradient(x,y,0,x,y,H*.9);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H)});
  stars.forEach(s=>{if(s.x>W)return;ctx.globalAlpha=.4+.5*Math.sin(s.t*2);ctx.fillStyle='#cfe';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill()});ctx.globalAlpha=1;
  if(P.length&&state!=='menu'){
    ctx.save();ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);        // screen shake
    // línea central punteada
    ctx.setLineDash([12,18]);ctx.lineWidth=4;ctx.strokeStyle='#00F5FF';ctx.shadowColor='#00F5FF';ctx.shadowBlur=15;
    ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
    // paletas neón redondeadas
    P.forEach(p=>{const fz=p.frozen>0;ctx.shadowColor=fz?'#9fe8ff':p.col;ctx.shadowBlur=25;
      ctx.fillStyle=fz?'#9fe8ff':p.col;rr(p.x-PW/2,p.y-p.h/2,PW,p.h,PW/2);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.55)';rr(p.x-2,p.y-p.h/2+6,4,p.h-12,2);ctx.fill()});
    // poder en el centro
    if(pw){const t=PWT[pw.t],pu=1+.15*Math.sin(pw.a*6);ctx.save();ctx.translate(W/2,H/2);if(portrait)ctx.rotate(Math.PI/2);
      ctx.shadowColor=t.c;ctx.shadowBlur=25;ctx.strokeStyle=t.c;ctx.lineWidth=4;ctx.fillStyle='rgba(5,5,16,.7)';
      ctx.beginPath();ctx.arc(0,0,24*pu,0,6.28);ctx.fill();ctx.stroke();
      ctx.shadowBlur=0;ctx.font='24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.i,0,2);ctx.restore()}
    // pelota con aura y rastro (invisible si es fantasma)
    if(B&&B.ghost<=0){const c=B.fire>0?'#ff6a00':'#aef';
      B.tr.forEach((t,i)=>{const k=i/B.tr.length;ctx.globalAlpha=k*.5;ctx.fillStyle=c;ctx.beginPath();ctx.arc(t.x,t.y,B.r*k,0,6.28);ctx.fill()});
      ctx.globalAlpha=1;ctx.shadowColor=c;ctx.shadowBlur=30;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(B.x,B.y,B.r,0,6.28);ctx.fill();ctx.globalAlpha=.25;ctx.fillStyle=c;
      ctx.beginPath();ctx.arc(B.x,B.y,B.r*2.2,0,6.28);ctx.fill();ctx.globalAlpha=1}
    ctx.restore()}
  // partículas
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1}

let last=0;function loop(t){const dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- Menús ---------- */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function online(){show('online');$('onl').textContent='Buscando rival…';clearTimeout(onT);   // simulado: aquí iría la sala Firebase/PeerJS
  onT=setTimeout(()=>{$('onl').textContent='¡Rival encontrado!';A.sfx('power');onT=setTimeout(start,900)},1800)}
const SW=$('sw');['#00F5FF','#FF2BD6','#7CFF4D','#FFC400','#FF5A36','#7000FF'].forEach(c=>{
  const b=document.createElement('button');b.className='sw'+(c.toLowerCase()===cfg.col.toLowerCase()?' sel':'');
  b.dataset.col=c;b.style.cssText=`background:${c};box-shadow:0 0 16px ${c}`;SW.appendChild(b)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;A.init();A.sfx('click');
  if(b.dataset.go){clearTimeout(onT);show(b.dataset.go);state='menu';document.body.classList.remove('playing')}
  if(b.dataset.diff){lvl=+b.dataset.diff;mode='ai';start()}
  if(b.dataset.mode==='local'){mode='local';start()}
  if(b.dataset.mode==='online'){mode='online';online()}
  if(b.id==='again')start();
  if(b.id==='snd'){A.on=!A.on;b.textContent='🔊 SONIDO: '+(A.on?'ON':'OFF')}
  if(b.dataset.col){cfg.col=b.dataset.col;try{localStorage.setItem('dmr_col',cfg.col)}catch(e){}
    document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('sel',x===b))}});
</script>
</body>
